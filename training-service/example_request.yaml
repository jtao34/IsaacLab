# 训练请求示例(= 前端表单最终生成的东西 / 客户在 console 里填的)。
# 两层:通用底座 + 任务专属段(goal)。

# --- 通用底座 ---
robot: so101                 # 见 profiles/robots.yaml(so100/so101/franka/ur10/anymal_c)
task: reach                  # 该机器人支持的任务(见 robots.yaml)
training_budget: standard    # quick | standard | thorough
sim2real_robustness: true    # 物理域随机化(仅 dr:true 的机器人可切换)
record_video: false
seed: 42
output_name: my_reach_v1
behavior: balanced           # balanced | precise | smooth(取决于任务 profile)

# --- 任务专属段(reach:目标区域;lift/velocity 结构不同,见各 tasks/<task>.yaml) ---
goal:
  target_zone:
    x: [-0.10, 0.10]
    y: [-0.25, -0.10]
    z: [0.10, 0.30]

# --- 高级(专家,选填):额外 Hydra override,原样透传 ---
advanced:
  overrides: []
