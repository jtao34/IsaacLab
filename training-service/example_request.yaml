# 训练请求示例(= 前端表单最终生成的东西 / 客户在 console 里填的)。
# 两层:通用底座 + 任务专属段(goal)。

# --- 通用底座 ---
model: so101                 # so100 | so101(现有 URDF)
task: reach                  # 见 profiles/ 下支持的任务
training_budget: standard    # quick | standard | thorough
sim2real_robustness: true    # 开启物理域随机化,利于迁到真机
record_video: false          # 录训练视频(存 logs/.../videos)
seed: 42
output_name: my_reach_v1
behavior: balanced           # balanced | precise | smooth

# --- 任务专属段(reach:目标区域) ---
goal:
  target_zone:
    x: [-0.10, 0.10]
    y: [-0.25, -0.10]
    z: [0.10, 0.30]

# --- 高级(专家,选填):额外 Hydra override,原样透传 ---
advanced:
  overrides: []
  # 例: ["agent.algorithm.learning_rate=5e-4", "env.episode_length_s=8.0"]
