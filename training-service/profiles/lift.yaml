# Lift-Cube 任务 profile。
display_name: "机械臂抓取 (Lift Cube)"
type: manager_based
train_script: soarm101/src/isaac_so_arm101/scripts/rsl_rl/train.py

task_ids:
  so100: Isaac-SO-ARM100-Lift-Cube-v0
  so101: Isaac-SO-ARM101-Lift-Cube-v0

goal_zones:
  # 物体初始摆放范围（重置事件的 pose_range）
  object_start_zone:
    label: "物体初始区域 (m)"
    x: {path: "env.events.reset_object_position.params.pose_range.x", default: [-0.10, 0.10], limits: [-0.30, 0.30]}
    y: {path: "env.events.reset_object_position.params.pose_range.y", default: [-0.20, 0.20], limits: [-0.30, 0.30]}
  # 放置目标范围（object_pose 指令）
  target_zone:
    label: "目标区域 (m)"
    x: {path: "env.commands.object_pose.ranges.pos_x", default: [0.10, 0.30], limits: [-0.35, 0.35]}
    y: {path: "env.commands.object_pose.ranges.pos_y", default: [-0.25, 0.25], limits: [-0.35, 0.35]}
    z: {path: "env.commands.object_pose.ranges.pos_z", default: [0.10, 0.30], limits: [0.0, 0.5]}

behavior_presets:
  balanced: {}
  precise:
    "env.rewards.object_goal_tracking_fine_grained.weight": 10.0
  smooth:
    "env.rewards.action_rate.weight": -0.001
    "env.rewards.joint_vel.weight": -0.001

# 关闭 sim2real 时的 no-op 覆盖（机械臂 + 物体 DR 全中和）
dr_off_overrides:
  "env.events.robot_joint_stiffness_and_damping.params.stiffness_distribution_params": [1.0, 1.0]
  "env.events.robot_joint_stiffness_and_damping.params.damping_distribution_params": [1.0, 1.0]
  "env.events.robot_joint_friction.params.friction_distribution_params": [0.0, 0.0]
  "env.events.object_mass.params.mass_distribution_params": [1.0, 1.0]
  "env.events.object_physics_material.params.static_friction_range": [1.0, 1.0]
  "env.events.object_physics_material.params.dynamic_friction_range": [1.0, 1.0]
